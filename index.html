function beep(f,d=.1,type='square',v=.06,delay=0,slide=0){
  if(muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.linearRampToValueAtTime(f+slide,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);}catch(e){}
}

function initMusic(){if(musBus||!AC)return;

  conv.buffer=buf;musBus.connect(dry);dry.connect(AC.destination);musBus.connect(conv);conv.connect(wet);wet.connect(AC.destination);}
function pnote(m,t,dur,vel){const f=440*Math.pow(2,(m-69)/12);const g=AC.createGain();
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vel,t+.01);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  [[1,'triangle',1],[2,'sine',.3],[3,'sine',.1],[.5,'sine',.25]].forEach(([k,type,a])=>{const o=AC.createOscillator(),og=AC.createGain();o.type=type;o.frequency.value=f*k;og.gain.value=a;o.connect(og);og.connect(g);o.start(t);o.stop(t+dur+.1);});
  g.connect(musBus);}
function musicPlayStep(tr,step){
  const spb=60/tr.bpm/2,t=mus.next,per=tr.pat=='waltz'?6:8,bar=Math.floor(step/per),s=step%per;
  const ch=tr.prog[Math.floor(bar/tr.bars)%tr.prog.length];
  if(tr.pat=='arp'){
    if(s==0)pnote(ch.b,t,spb*7,.5);
    const order=[0,1,2,3,2,1,2,1];pnote(ch.c[order[s]],t,spb*3.2,.2);
  }else if(tr.pat=='waltz'){
    if(s==0)pnote(ch.b,t,spb*5,.5);
    if(s==2||s==4){pnote(ch.c[0],t,spb*2,.17);pnote(ch.c[1],t,spb*2,.15);pnote(ch.c[2],t,spb*2,.15);}
  }else{
    if(s==0||s==4)pnote(ch.b,t,spb*3,.45);
    if(s==2||s==6)pnote(ch.c[(s/2)%3+1>3?3:(s/2)%3+1],t,spb*1.4,.2);
    if(s==3||s==7)pnote(ch.c[3],t,spb*1.2,.12);
  }
  // melody (random walk, leans on chord tones)
  const sc=tr.scale,prob=s==0?1:(s==4||(tr.pat=='waltz'&&s==3))?.7:(s==2||s==6)?.3:0;
  if(Math.random()<prob){
    const mv=[-2,-1,-1,0,1,1,2];mus.idx=clamp(mus.idx+mv[Math.floor(Math.random()*mv.length)],0,sc.length-1);
    if(Math.random()<.45){let best=mus.idx,bd=9;for(let k=-2;k<=2;k++){const j=mus.idx+k;if(j>=0&&j<sc.length&&ch.pc.includes(sc[j]%12)&&Math.abs(k)<bd){bd=Math.abs(k);best=j;}}mus.idx=best;}
    pnote(sc[mus.idx],t,spb*(s==0?4.5:3),s==0?.42:.34);
  }
}
function musicTick(){if(!AC||AC.state!=='running'||!mus.name)return;const tr=TRACKS[mus.name];if(!tr)return;

  while(mus.next<AC.currentTime+.5){musicPlayStep(tr,mus.step);mus.next+=spb;mus.step++;}}
function musicSet(name){if(mus.name===name)return;mus.name=name;mus.step=0;mus.idx=Math.floor((TRACKS[name].scale.length)/2);if(AC)mus.next=AC.currentTime+.15;
  if(!mus.timer)mus.timer=setInterval(musicTick,120);}

const MAPIDS=['V','R','P','M'],DIRN=['up','down','left','right'];
function sum36(b){let c=0;for(const ch of b)c=(c*31+ch.charCodeAt(0))%46656;return c.toString(36).toUpperCase().padStart(3,'0');}
function makeCode(){
  const d=[1,MAPIDS.indexOf(map),px,py,DIRN.indexOf(pdir),thanks,onigiri,flags.starter?1:0,flags.cleared?1:0,flags.guardMsg?1:0,party.map(m=>[m.id,m.lv,m.exp,m.hp]),NPCS.filter(n=>n.defeated).map(n=>n.id),NPCS.filter(n=>n.talked).map(n=>n.id)];
  const b=btoa(unescape(encodeURIComponent(JSON.stringify(d)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  return 'ARI1-'+b+'-'+sum36(b);
}
function applyCode(str){
  try{
    str=String(str).replace(/\s+/g,'');const m=str.match(/^ARI1-([A-Za-z0-9_-]+)-([0-9A-Za-z]{3})$/);if(!m)return 'コードの かたちが ちがうみたい';
    if(sum36(m[1])!==m[2].toUpperCase())return 'コードが まちがっているみたい（もじを たしかめてね）';
    let b=m[1].replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';
    const d=JSON.parse(decodeURIComponent(escape(atob(b))));
    if(d[0]!==1||!Array.isArray(d[10])||!d[10].length)return 'この コードは つかえないよ';
    const pt=d[10].map(([id,lv,exp,hp])=>{if(!SP[id])throw 0;const mm=mkMon(id,lv);mm.exp=exp;mm.hp=Math.min(mm.max,Math.max(0,hp));return mm;});
    map=MAPIDS[d[1]]||'V';px=d[2];py=d[3];pdir=DIRN[d[4]]||'down';thanks=d[5];onigiri=d[6];
    flags={};if(d[7])flags.starter=true;if(d[8])flags.cleared=true;if(d[9])flags.guardMsg=true;
    party=pt;NPCS.forEach(n=>{n.defeated=d[11].includes(n.id);n.talked=d[12].includes(n.id);});
    if(solid(px,py)){px=8;py=10;}
    mode='world';busy=false;moving=null;save();mapToast(MAPS[map].name);return '';
  }catch(e){return 'コードを よみとれなかったよ';}
}
