function beep(f,d=.1,type='square',v=.06,delay=0,slide=0){

}

function load(){try{const d=JSON.parse(localStorage.getItem('arigatouWorld1'));if(!d)return false;

// ================= layout & input =================
function layout(){
  const touch=matchMedia('(pointer:coarse)').matches||innerWidth<innerHeight*.9;
  CH=touch?Math.round(clamp(innerHeight*.3,170,250)):0;
  W=innerWidth;H=innerHeight-CH;dpr=Math.min(2,devicePixelRatio||1);
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  ts=clamp(Math.floor(Math.min(W,H*.68)/9),30,60);GW=Math.min(W,560);gx=(W-GW)/2;tileCache={};
  ctl.className=touch?'on':'';ctl.style.height=CH+'px';
  if(touch){const u=Math.min(64,CH*.3),cx=18+u*1.55,cy=CH/2+4;
    const set=(id,x,y,w,h)=>{const e=document.getElementById(id);e.style.left=x+'px';e.style.top=y+'px';e.style.width=w+'px';e.style.height=h+'px';};
    set('bu',cx-u/2,cy-u*1.5,u,u);set('bd',cx-u/2,cy+u*.5,u,u);set('bl',cx-u*1.5,cy-u/2,u,u);set('br',cx+u/2,cy-u/2,u,u);
    const as=Math.min(92,CH*.5);set('A',W-as-22,CH/2-as/2+18,as,as);set('B',W-22-96,6,96,38);
  }
}

const keys={};let dirHeld=null;
const DIRS={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
addEventListener('keydown',e=>{if(e.target&&e.target.tagName=='TEXTAREA')return;if(e.repeat&&!DIRS[e.code])return;keys[e.code]=true;
  if(DIRS[e.code]){e.preventDefault();if(choice)choiceMove(DIRS[e.code]);}
  if(e.code=='Enter'||e.code=='Space'||e.code=='KeyZ'){e.preventDefault();pressA();}
  if(e.code=='KeyX'||e.code=='Escape'||e.code=='KeyM'){e.preventDefault();pressB();}});
addEventListener('keyup',e=>keys[e.code]=false);
function curDir(){if(dirHeld)return dirHeld;for(const k in DIRS)if(keys[k])return DIRS[k];return null;}
function holdBtn(id,fn,up){const b=document.getElementById(id);
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);b.classList.add('p');fn();});
  const off=e=>{e.preventDefault();b.classList.remove('p');if(up)up();};
  b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);}
['up','down','left','right'].forEach((d,i)=>holdBtn(['bu','bd','bl','br'][i],()=>{dirHeld=d;if(choice)choiceMove(d);},()=>{if(dirHeld==d)dirHeld=null;}));
holdBtn('A',()=>pressA());holdBtn('B',()=>pressB());
function pressA(){beepInit();if(choice){choiceDone(choice.sel);return;}
  if(aRes){const r=aRes;aRes=null;r();return;}
  if(mode=='world'&&!busy)interact();
  else if(mode=='title')titleGo();}
function pressB(){beepInit();if(choice&&choice.cancel!==undefined){choiceDone(choice.cancel);return;}if(mode=='world'&&!busy)openMenu();}
function beepInit(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();}catch(e){}}
cv.addEventListener('pointerdown',e=>{beepInit();const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  if(choice){for(let i=0;i<choice.rects.length;i++){const q=choice.rects[i];if(x>=q.x&&x<=q.x+q.w&&y>=q.y&&y<=q.y+q.h){choice.sel=i;choiceDone(i);return;}}
    if(choice.cancelRect){const q=choice.cancelRect;if(x>=q.x&&x<=q.x+q.w&&y>=q.y&&y<=q.y+q.h){choiceDone(choice.cancel);return;}}return;}
  if(aRes){pressA();return;}
  if(mode=='title'){for(const b of titleBtns){if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.fn();return;}}return;}
  if(mode=='world'&&!busy){const q=menuBtn;if(x>=q.x&&x<=q.x+q.w&&y>=q.y&&y<=q.y+q.h){openMenu();return;}if(CH==0)interact();}
  if(mode=='ending'&&endBtn){const q=endBtn;if(x>=q.x&&x<=q.x+q.w&&y>=q.y&&y<=q.y+q.h){mode='world';busy=false;save();}}
});

// ================= text & choices =================
function say(text){return new Promise(res=>{box={text,shown:0,done:false};aRes=()=>{if(!box.done){box.shown=box.text.length;box.done=true;aRes=()=>{box=null;res();};}};
  // typing handled in update; make A advance after done
  box.res=res;aRes=function again(){if(!box.done){box.shown=box.text.length;box.done=true;aRes=again;}else{const r=box.res;box=null;aRes=null;r();}};});}
function sayAuto(text,ms=900){return new Promise(res=>{box={text,shown:0,done:false,auto:true};setTimeout(()=>{box=null;res();},ms+text.length*35);});}
function choose(opts,o={}){return new Promise(res=>{choice={...o,opts,sel:0,cols:o.cols||1,res,rects:[]};});}
function choiceMove(d){if(!choice)return;const n=choice.opts.length,c=choice.cols;let s=choice.sel;
  if(c==1){if(d=='up')s=(s+n-1)%n;if(d=='down')s=(s+1)%n;}else{if(d=='left'&&s%c>0)s--;if(d=='right'&&s%c<c-1&&s+1<n)s++;if(d=='up'&&s-c>=0)s-=c;if(d=='down'&&s+c<n)s+=c;}
  choice.sel=s;sTap();}
function choiceDone(i){if(!choice)return;const r=choice.res;choice=null;sTap();r(i);}
function pop(text,x,y,col='#ff5e8a',size=22){popups.push({t:text,x,y,c:col,s:size,life:1.1,vy:-40});}

// ================= drawing helpers =================
function T(t,x,y,size,col='#fff',al='center',w='bold'){ctx.font=`${w} ${size}px ${FONT}`;ctx.fillStyle=col;ctx.textAlign=al;ctx.textBaseline='middle';ctx.fillText(t,x,y);}
function TF(t,x,y,size,col='#fff',al='center',maxW=9999,w='bold'){ctx.font=`${w} ${size}px ${FONT}`;const m=ctx.measureText(t).width;if(m>maxW)size=Math.max(8,Math.floor(size*maxW/m));T(t,x,y,size,col,al,w);}
function TL(t,x,y,size,col,lh,al='left',w='bold',maxW=9999){String(t).split('\n').forEach((l,i)=>TF(l,x,y+i*lh,size,col,al,maxW,w));}
function wrapLines(text,maxW,size,w='bold'){ctx.font=`${w} ${size}px ${FONT}`;const out=[];for(const para of String(text).split('\n')){let line='';for(const ch of para){if(ctx.measureText(line+ch).width>maxW&&line){out.push(line);line=ch;}else line+=ch;}out.push(line);}return out;}
function rr(x,y,w,h,r,fill,stroke,lw=3){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}}
function ell(x,y,rx,ry,fill,stroke,lw=2){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}}

// ---- creature sprite
function star(x,y,r,col){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q);}ctx.closePath();ctx.fillStyle=col;ctx.fill();ctx.strokeStyle='#c99a10';ctx.lineWidth=2;ctx.stroke();}
function drawMon(id,cx,cy,s,t,hurt=0,flip=false){

// ---- person sprite (overworld)
function drawPerson(cx,cy,s,dir,look,step,isPlayer){
  ctx.save();ctx.translate(cx,cy);const lk=look,b=Math.abs(Math.sin(step*Math.PI))*s*.06;
  ell(0,s*.02,s*.3,s*.08,'rgba(0,0,0,.2)');ctx.translate(0,-b);
  const lw=Math.sin(step*Math.PI*2)*s*.07;
  rr(-s*.17,-s*.3+lw*0,s*.14,s*.3,3,'#4a5a8a');rr(s*.03,-s*.3,s*.14,s*.3,3,'#4a5a8a');
  if(lk.cape){ctx.beginPath();ctx.moveTo(-s*.3,-s*.62);ctx.lineTo(s*.3,-s*.62);ctx.lineTo(s*.38,-s*.1);ctx.lineTo(-s*.38,-s*.1);ctx.closePath();ctx.fillStyle='#d8345a';ctx.fill();}
  rr(-s*.24,-s*.64,s*.48,s*.4,6,lk.shirt,shade(lk.shirt.startsWith('#')?lk.shirt:'#888888',-50),2);
  if(lk.coat){rr(-s*.06,-s*.64,s*.12,s*.4,2,'#cfe');}
  ell(-s*.26,-s*.46,s*.07,s*.1,lk.skin);ell(s*.26,-s*.46,s*.07,s*.1,lk.skin);
  ell(0,-s*.82,s*.27,s*.26,lk.skin,shade('#d9a47a',-30),2);
  // hair / hat
  if(dir=='up'){ell(0,-s*.84,s*.28,s*.27,lk.hair);}
  else{ctx.beginPath();ctx.arc(0,-s*.86,s*.28,Math.PI,0);ctx.fillStyle=lk.hair;ctx.fill();if(lk.braid){ell(s*.28,-s*.7,s*.07,s*.16,lk.hair);ell(-s*.28,-s*.7,s*.07,s*.16,lk.hair);}}
  if(lk.hat){ctx.beginPath();ctx.arc(0,-s*.9,s*.29,Math.PI,0);ctx.fillStyle=lk.hat;ctx.fill();if(dir!='up')rr(-s*.3,-s*.92,s*.6,s*.07,3,shade(lk.hat.startsWith('#')?lk.hat:'#888888',-30));}
  if(isPlayer){heart(0,-s*1.02,s*.1,'#ff4f7b');}
  if(dir!='up'){const ox=dir=='left'?-s*.08:dir=='right'?s*.08:0;
    for(const k of[-1,1]){const x=ox+k*s*.1;if(dir=='left'&&k==1)continue;if(dir=='right'&&k==-1)continue;ell(x,-s*.8,s*.035,s*.05,'#2b2230');}

  ctx.restore();
}

// ---- tiles
let tileCache={};
function getTile(ch,v){const key=ch+v;if(tileCache[key])return tileCache[key];
  const c=document.createElement('canvas');c.width=c.height=ts;const g=c.getContext('2d');const s=ts;
  const grass=(base='#7ccf6e')=>{g.fillStyle=base;g.fillRect(0,0,s,s);g.fillStyle='#69bd5c';for(let i=0;i<4;i++){const x=((v*37+i*53)%100)/100*s*.8+s*.05,y=((v*61+i*29)%100)/100*s*.8+s*.1;g.fillRect(x,y,2,s*.12);g.fillRect(x+3,y+2,2,s*.09);}};
  switch(ch){
   case '.':grass();break;
   case 'f':grass();for(let i=0;i<3;i++){const x=s*(.2+.3*i)+v%3*2,y=s*(.3+.25*((i+v)%2));g.fillStyle=['#ff7aa8','#ffd23f','#fff'][(i+v)%3];g.beginPath();g.arc(x,y,s*.07,0,7);g.fill();g.fillStyle='#ffb02e';g.beginPath();g.arc(x,y,s*.03,0,7);g.fill();}break;
   case ',':grass('#5fb856');g.strokeStyle='#3f9c42';g.lineWidth=2;for(let i=0;i<7;i++){const x=s*(.08+.13*i),y=s*(.35+.4*(((i*3+v)%4)/4));g.beginPath();g.moveTo(x,y+s*.25);g.quadraticCurveTo(x+2,y,x-3+(i%2)*6,y-s*.12);g.stroke();}g.fillStyle='#ffe066';g.beginPath();g.arc(s*.7,s*.25,s*.045,0,7);g.fill();break;
   case '=':g.fillStyle='#ead9a8';g.fillRect(0,0,s,s);g.fillStyle='#d9c58e';for(let i=0;i<5;i++)g.fillRect(((v*29+i*41)%100)/100*s*.9,((v*47+i*23)%100)/100*s*.9,3,3);break;
   case 'T':grass();g.fillStyle='#7a4e26';g.fillRect(s*.4,s*.55,s*.2,s*.4);g.fillStyle='#2f8a3e';g.beginPath();g.arc(s*.5,s*.4,s*.38,0,7);g.fill();g.fillStyle='#43a64f';g.beginPath();g.arc(s*.4,s*.32,s*.2,0,7);g.fill();break;
   case 'W':g.fillStyle='#62bdf0';g.fillRect(0,0,s,s);g.strokeStyle='#a6e0fa';g.lineWidth=2;for(let i=0;i<2;i++){g.beginPath();g.moveTo(s*.1,s*(.35+.35*i));g.quadraticCurveTo(s*.3,s*(.25+.35*i),s*.5,s*(.35+.35*i));g.quadraticCurveTo(s*.7,s*(.45+.35*i),s*.9,s*(.35+.35*i));g.stroke();}break;
   case 'R':case 'r':case 'p':{const col=ch=='R'?'#e0644a':ch=='r'?'#4a7fd0':'#f08cab';g.fillStyle=col;g.fillRect(0,0,s,s);g.fillStyle='rgba(0,0,0,.12)';for(let y=0;y<s;y+=s/4)g.fillRect(0,y,s,2);g.fillStyle='rgba(255,255,255,.18)';g.fillRect(0,0,s,s*.12);break;}
   case 'H':g.fillStyle='#f5e9cf';g.fillRect(0,0,s,s);g.fillStyle='#c9b88f';g.fillRect(0,s-4,s,4);g.fillStyle='#8fd0f2';g.fillRect(s*.25,s*.2,s*.5,s*.4);g.strokeStyle='#8a6a3a';g.lineWidth=2;g.strokeRect(s*.25,s*.2,s*.5,s*.4);g.beginPath();g.moveTo(s*.5,s*.2);g.lineTo(s*.5,s*.6);g.stroke();break;
   case 'D':g.fillStyle='#f5e9cf';g.fillRect(0,0,s,s);g.fillStyle='#9a5a2a';g.fillRect(s*.2,s*.1,s*.6,s*.9);g.fillStyle='#ffd23f';g.beginPath();g.arc(s*.68,s*.58,s*.05,0,7);g.fill();g.fillStyle='#ff5e8a';g.beginPath();g.arc(s*.5,s*.32,s*.08,0,7);g.fill();break;
   case '#':grass();g.fillStyle='#b8864a';g.fillRect(0,s*.35,s,s*.12);g.fillRect(0,s*.6,s,s*.12);for(let i=0;i<3;i++)g.fillRect(s*(.1+.35*i),s*.25,s*.1,s*.6);break;
   case 'S':g.fillStyle='#ead9a8';g.fillRect(0,0,s,s);g.fillStyle='#8a5a2a';g.fillRect(s*.46,s*.5,s*.08,s*.45);g.fillStyle='#d9a45a';g.fillRect(s*.15,s*.2,s*.7,s*.4);g.strokeStyle='#8a5a2a';g.lineWidth=2;g.strokeRect(s*.15,s*.2,s*.7,s*.4);g.fillStyle='#ff4f7b';g.beginPath();g.arc(s*.5,s*.4,s*.1,0,7);g.fill();break;
  }
  return tileCache[key]=c;}

// ================= overworld =================
function drawWorld(){
  const m=MAPS[map];ctx.fillStyle='#3d6f3f';ctx.fillRect(0,0,W,H);
  let ox=px+(moving?moving.dx*moving.p:0),oy=py+(moving?moving.dy*moving.p:0);
  let camX=ox*ts+ts/2-W/2,camY=oy*ts+ts/2-H/2;
  const mw=m.w*ts,mh=m.h*ts;camX=mw<W?-(W-mw)/2:clamp(camX,0,mw-W);camY=mh<H?-(H-mh)/2:clamp(camY,0,mh-H);
  camX=Math.round(camX);camY=Math.round(camY);
  const x0=Math.max(0,Math.floor(camX/ts)),x1=Math.min(m.w-1,Math.floor((camX+W)/ts)),y0=Math.max(0,Math.floor(camY/ts)),y1=Math.min(m.h-1,Math.floor((camY+H)/ts));
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)ctx.drawImage(getTile(m.g[y][x],(x*7+y*13)%9),x*ts-camX,y*ts-camY);
  // inn sign hint: heart on okami
  // sprites sorted by y
  const list=[];for(const n of npcs())list.push({y:n.y,fn:()=>drawPerson(n.x*ts+ts/2-camX,(n.y+1)*ts-ts*.08-camY,ts*.95,n.dir,n.look,0,false),n});
  list.push({y:oy,fn:()=>drawPerson(ox*ts+ts/2-camX,(oy+1)*ts-ts*.08-camY,ts*.95,pdir,{hair:'#5a3a22',shirt:'#34c6a5',skin:'#f6d2ae',hat:'#ffffff'},walk,true)});
  list.sort((a,b)=>a.y-b.y);list.forEach(o=>o.fn());
  // "!" marks & talk bubbles for undefeated trainers / hakase
  for(const n of npcs()){if((n.trainer&&!n.defeated)||(n.id=='hakase'&&!flags.starter)){const bob=Math.sin(gt*4)*3;heart(n.x*ts+ts/2-camX,n.y*ts-ts*.28-camY+bob,ts*.13,n.trainer?'#ffb02e':'#ff4f7b');}}
  let near=null,nd=99;for(const n of npcs()){if(n.member){const d=Math.abs(n.x-px)+Math.abs(n.y-py);if(d<nd){nd=d;near=n;}}}
  for(const n of (near&&nd<=3?[near]:[])){{ctx.font=`bold 13px ${FONT}`;const tw=Math.min(ctx.measureText(n.name).width+18,W-20),lx=clamp(n.x*ts+ts/2-camX,tw/2+6,W-tw/2-6),ly=n.y*ts-ts*.45-camY;rr(lx-tw/2,ly-13,tw,26,13,'rgba(30,40,35,.85)','#ffd0dc',2);TF(n.name,lx,ly,13,'#fff','center',tw-12);}}
  // map name
  if(toast&&toast.life>0){ctx.globalAlpha=Math.min(1,toast.life*2);rr(W/2-120,62,240,38,12,'rgba(30,40,35,.8)');TF(toast.t,W/2,82,17,'#fff','center',216);ctx.globalAlpha=1;}

const MAPIDS=['V','R','P','M'],DIRN=['up','down','left','right'];
function sum36(b){let c=0;for(const ch of b)c=(c*31+ch.charCodeAt(0))%46656;return c.toString(36).toUpperCase().padStart(3,'0');}
function makeCode(){
  const d=[1,MAPIDS.indexOf(map),px,py,DIRN.indexOf(pdir),thanks,onigiri,flags.starter?1:0,flags.cleared?1:0,flags.guardMsg?1:0,party.map(m=>[m.id,m.lv,m.exp,m.hp]),NPCS.filter(n=>n.defeated).map(n=>n.id),NPCS.filter(n=>n.talked).map(n=>n.id)];
  const b=btoa(unescape(encodeURIComponent(JSON.stringify(d)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  return 'ARI1-'+b+'-'+sum36(b);
}
function applyCode(str){
  try{
    str=String(str).replace(/\s+/g,'');const m=str.match(/^ARI1-([A-Za-z0-9_-]+)-([0-9A-Za-z]{3})$/);if(!m)return 'コードの かたちが ちがうみたい';
    if(sum36(m[1])!==m[2].toUpperCase())return 'コードが まちがっているみたい（もじを たしかめてね）';
    let b=m[1].replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';
    const d=JSON.parse(decodeURIComponent(escape(atob(b))));
    if(d[0]!==1||!Array.isArray(d[10])||!d[10].length)return 'この コードは つかえないよ';
    const pt=d[10].map(([id,lv,exp,hp])=>{if(!SP[id])throw 0;const mm=mkMon(id,lv);mm.exp=exp;mm.hp=Math.min(mm.max,Math.max(0,hp));return mm;});
    map=MAPIDS[d[1]]||'V';px=d[2];py=d[3];pdir=DIRN[d[4]]||'down';thanks=d[5];onigiri=d[6];
    flags={};if(d[7])flags.starter=true;if(d[8])flags.cleared=true;if(d[9])flags.guardMsg=true;
    party=pt;NPCS.forEach(n=>{n.defeated=d[11].includes(n.id);n.talked=d[12].includes(n.id);});
    if(solid(px,py)){px=8;py=10;}
    mode='world';busy=false;moving=null;save();mapToast(MAPS[map].name);return '';
  }catch(e){return 'コードを よみとれなかったよ';}
}

  else{await say(`${opts.trainer.name}が\nしょうぶを しかけてきた！`);await say(`${opts.trainer.name}は ${SP[B.e.id].n}を\nくりだした！`);}
  await say(`ゆけっ！ ${SP[B.p.id].n}！`);
  let result='';
  while(true){
    const cur=B.p,foe=B.e;
    // main menu
    const i=await choose(['アピール','なかま','おにぎり ×'+onigiri,'にげる'],{cols:2,bottom:true,title:'どうする？',sub:`${SP[cur.id].n}は どうする？`});
    let acted=null; // {kind}
    if(i==0){
      const mvs=SP[cur.id].m;
      const k=await choose(mvs.map(n=>n),{cols:2,bottom:true,cancel:-1,cancelLabel:'もどる',colors:mvs.map(n=>TCOL[MOVES[n][0]]),sub:'どんな アピールを する？',moveInfo:mvs.map(n=>`${TYPES[MOVES[n][0]]} ・ いりょく${MOVES[n][1]}`)});
      if(k<0||k===undefined)continue;acted={kind:'move',mv:mvs[k]};
    }else if(i==1){
      const k=await partyScreen(true,party.indexOf(cur));if(k<0)continue;acted={kind:'switch',k};
    }else if(i==2){
      if(onigiri<=0){await say('おにぎりが ない！');continue;}
      if(cur.hp>=cur.max){await say('いまは げんきいっぱい！');continue;}
      acted={kind:'item'};
    }else{
      if(opts.wild){await say('ふかぶかと おじぎして\nそっと たちさった！');result='run';break;}
      await say('ともだちからは にげられない！\nさいごまで たのしもう！');continue;}
    // order
    const enemyMv=pickEnemyMove(foe,cur);
    const playerFirst=acted.kind!='move'||cur.spd>=foe.spd||Math.random()<.1&&false;
    const doPlayer=async()=>{
      if(acted.kind=='move'){await playMove(cur,foe,acted.mv,true);}
      else if(acted.kind=='switch'){await say(`もどって、${SP[cur.id].n}！\nありがとう！`);party[party.indexOf(cur)].hp=B.pHP>0?B.pHP:cur.hp;B.pGone=true;const n=party[acted.k];B.p=n;B.pHP=n.hp;B.pGone=false;await say(`ゆけっ！ ${SP[n.id].n}！`);}
      else{onigiri--;cur.hp=Math.min(cur.max,cur.hp+30);sLove();await tween(B,'pHP',cur.hp,400);await say(`${SP[cur.id].n}は おにぎりを\nもぐもぐ！ げんきが でた！`);}
    };
    const doEnemy=async()=>{await playMove(B.e,B.p,enemyMv,false);};
    const pCur=()=>B.p;
    let playerActed=false;
    if(playerFirst){await doPlayer();playerActed=true;}
    if(B.e.hp>0&&B.p.hp>0&&!(playerFirst&&false)){await doEnemy();}
    if(!playerFirst){if(B.p.hp>0&&B.e.hp>0){await doPlayer();}}
    // resolve faints
    if(B.e.hp<=0){
      await faintSeq(B.e,false);
      const winner=party.indexOf(cur)>=0&&B.p.hp>0?B.p:null;
      if(winner)await gainExp(B.e,winner);
      fi++;
      if(fi>=foes.length){result='win';break;}
      B.e=foes[fi];B.eHP=B.e.hp;B.eGone=false;
      await say(`${opts.trainer.name}は つぎに\n${SP[B.e.id].n}を くりだした！`);
    }
    if(B.p.hp<=0){
      if(!B.pGone)await faintSeq(B.p,true);
      const alive=party.map((m,k)=>k).filter(k=>party[k].hp>0);
      if(!alive.length){result='lose';break;}
      await say('ほかの なかまを だそう！');
      let k;while(true){k=await partyScreen(true,-2);if(k>=0)break;}
      B.p=party[k];B.pHP=B.p.hp;B.pGone=false;await say(`ゆけっ！ ${SP[B.p.id].n}！`);
    }
  }
  // sync final hp
  if(B.p&&B.p.hp>0&&B.pHP>=0)B.p.hp=Math.min(B.p.max,Math.max(B.p.hp,0));
  return result;
}
